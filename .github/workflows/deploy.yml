name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "C:\apache-maven-3.9.9\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $settingsDir = "$HOME\.m2"
          if (!(Test-Path $settingsDir)) { mkdir $settingsDir }
          @"
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <mirrorOf>central</mirrorOf>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>
          "@ | Set-Content "$settingsDir\settings.xml" -Encoding utf8
      - name: Run backend tests
        run: mvn test -q
        working-directory: backend
      - name: Package backend
        run: mvn package -DskipTests -q
        working-directory: backend
      - shell: powershell
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PDD_CLIENT_ID: ${{ secrets.PDD_CLIENT_ID }}
          PDD_CLIENT_SECRET: ${{ secrets.PDD_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          Copy-Item backend/giftgpt-server/target/giftgpt-server-1.0.0-SNAPSHOT.jar C:\giftgpt\ -Force
          $jwtSecret = $env:JWT_SECRET
          if ([string]::IsNullOrWhiteSpace($jwtSecret)) {
            $jwtSecret = "giftgpt-prod-temp-" + [guid]::NewGuid().ToString("N")
            Write-Output "WARN: JWT_SECRET not configured, generated a temporary secret"
          }
          $config = @"
          spring:
            h2:
              console:
                enabled: false
          sa-token:
            jwt-secret-key: $jwtSecret
          giftgpt:
            ai:
              deepseek:
                api-key: $env:DEEPSEEK_API_KEY
            commerce:
              pinduoduo:
                client-id: $env:PDD_CLIENT_ID
                client-secret: $env:PDD_CLIENT_SECRET
          "@
          mkdir C:\giftgpt\config -Force | Out-Null
          $config | Set-Content C:\giftgpt\config\application-prod.yml -Force
          Get-CimInstance Win32_Process -Filter "Name='java.exe'" | Where-Object { $_.CommandLine -like '*giftgpt*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep 2
          schtasks /End /TN "GiftGPT-Backend" 2>$null | Out-Null
          schtasks /Run /TN "GiftGPT-Backend" | Out-Null
      - name: Verify backend
        shell: powershell
        run: |
          Start-Sleep 15
          $r = Invoke-WebRequest -Uri "http://localhost:8080/api/v1/products/platforms/pinduoduo/authority" -UseBasicParsing -TimeoutSec 15 -ErrorAction SilentlyContinue
          if ($r -and $r.StatusCode -eq 200) { Write-Output "BACKEND OK" } else { Write-Output "BACKEND WARN: not responding yet" }
