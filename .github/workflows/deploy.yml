name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "C:\apache-maven-3.9.9\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $settingsDir = "$HOME\.m2"
          if (!(Test-Path $settingsDir)) { mkdir $settingsDir }
          @"
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <mirrorOf>central</mirrorOf>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>
          "@ | Set-Content "$settingsDir\settings.xml" -Encoding utf8
      - name: Run backend tests
        run: mvn test -q
        working-directory: backend
      - name: Package backend
        run: mvn package -DskipTests -q
        working-directory: backend
      - shell: powershell
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PDD_CLIENT_ID: ${{ secrets.PDD_CLIENT_ID }}
          PDD_CLIENT_SECRET: ${{ secrets.PDD_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          Start-Transcript -Path C:\giftgpt\deploy-transcript.log -Force
          try {
            $ErrorActionPreference = 'Stop'
            $workspace = (Get-Location).Path
            $target = 'C:\giftgpt'
            $configDir = Join-Path $target 'config'
            New-Item -ItemType Directory -Force -Path $configDir | Out-Null
            Write-Output "WORKSPACE=$workspace"

            # Stop the scheduled backend task first (it also stops the child java process)
            cmd /c "schtasks /End /TN GiftGPT-Backend >nul 2>&1"
            Start-Sleep -Seconds 3
            Get-CimInstance Win32_Process -Filter "Name='java.exe'" | Where-Object { $_.CommandLine -like '*giftgpt-server-1.0.0-SNAPSHOT.jar*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2

            $jarSource = Join-Path $workspace 'backend\giftgpt-server\target\giftgpt-server-1.0.0-SNAPSHOT.jar'
            $jarDest = Join-Path $target 'giftgpt-server-1.0.0-SNAPSHOT.jar'
            Write-Output "JAR_SOURCE=$jarSource EXISTS=$(Test-Path $jarSource)"
            if (-not (Test-Path $jarSource)) { throw "Jar not found: $jarSource" }
            Copy-Item $jarSource $jarDest -Force

          # JWT secret: GitHub Secret wins; otherwise reuse the persisted server secret file
          $secretFile = Join-Path $configDir 'jwt-secret.txt'
          if ([string]::IsNullOrWhiteSpace($env:JWT_SECRET)) {
            if (Test-Path $secretFile) {
              $jwtSecret = (Get-Content $secretFile -Raw).Trim()
            } else {
              $rng = New-Object System.Security.Cryptography.RNGCryptoServiceProvider
              $bytes = New-Object byte[] 32
              $rng.GetBytes($bytes)
              $jwtSecret = -join ($bytes | ForEach-Object { $_.ToString('x2') })
              Set-Content -Path $secretFile -Value $jwtSecret -Encoding ascii -Force
              Write-Output "WARN: JWT_SECRET not configured, generated and persisted a server secret"
            }
          } else {
            $jwtSecret = $env:JWT_SECRET
            Set-Content -Path $secretFile -Value $jwtSecret -Encoding ascii -Force
          }

          # Keep existing server keys when a GitHub Secret is not configured
          $oldConfig = Join-Path $configDir 'application-prod.yml'
          $old = if (Test-Path $oldConfig) { Get-Content $oldConfig -Raw } else { '' }
          $deepseekKey = if (![string]::IsNullOrWhiteSpace($env:DEEPSEEK_API_KEY)) { $env:DEEPSEEK_API_KEY } elseif ($old -match 'api-key:\s*(\S+)') { $matches[1].Trim() } else { '' }
          $pddClientId = if (![string]::IsNullOrWhiteSpace($env:PDD_CLIENT_ID)) { $env:PDD_CLIENT_ID } elseif ($old -match 'client-id:\s*(\S+)') { $matches[1].Trim() } else { '' }
          $pddClientSecret = if (![string]::IsNullOrWhiteSpace($env:PDD_CLIENT_SECRET)) { $env:PDD_CLIENT_SECRET } elseif ($old -match 'client-secret:\s*(\S+)') { $matches[1].Trim() } else { '' }

          $config = @"
          spring:
            h2:
              console:
                enabled: false
          sa-token:
            jwt-secret-key: $jwtSecret
          giftgpt:
            ai:
              deepseek:
                api-key: $deepseekKey
            commerce:
              pinduoduo:
                client-id: $pddClientId
                client-secret: $pddClientSecret
          "@
          $config | Set-Content -Path $oldConfig -Encoding utf8 -Force
            Write-Output "CONFIG_WRITTEN=$oldConfig"

            # Start via WMI so the backend process is not killed when the Actions job exits
            $proc = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine = 'cmd.exe /c C:\giftgpt\start-backend.bat'
              CurrentDirectory = 'C:\giftgpt'
            }
            Write-Output ("BACKEND DEPLOYED AND STARTED PID=" + $proc.ProcessId)
            if ($proc.ReturnValue -ne 0) { throw "Failed to start backend: $($proc.ReturnValue)" }
          } catch {
            $_ | Out-String | Set-Content -Path C:\giftgpt\deploy-error.log -Encoding utf8
            Write-Error $_
            exit 1
          } finally {
            Stop-Transcript -ErrorAction SilentlyContinue
          }
          exit 0
      - name: Verify backend
        shell: powershell
        run: |
          $ok = $false
          for ($i = 0; $i -lt 15; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8080/api/v1/products/platforms/pinduoduo/authority" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep 2
          }
          if (-not $ok) { throw "Backend did not become healthy" }
          Write-Output "BACKEND OK"
