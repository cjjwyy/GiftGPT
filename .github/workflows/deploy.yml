name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/**'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "C:\apache-maven-3.9.9\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-17.0.14.7-hotspot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $settingsDir = "$HOME\.m2"
          if (!(Test-Path $settingsDir)) { mkdir $settingsDir }
          @"
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <mirrorOf>central</mirrorOf>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/public</url>
              </mirror>
            </mirrors>
          </settings>
          "@ | Set-Content "$settingsDir\settings.xml" -Encoding utf8
      - name: Run backend tests
        run: mvn test -q
        working-directory: backend
      - name: Package backend
        run: mvn package -DskipTests -q
        working-directory: backend
      - shell: powershell
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PDD_CLIENT_ID: ${{ secrets.PDD_CLIENT_ID }}
          PDD_CLIENT_SECRET: ${{ secrets.PDD_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          $ErrorActionPreference = 'Continue'
          $target = 'C:\giftgpt'
          $configDir = Join-Path $target 'config'
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null

          # Stop the running app before replacing the jar (avoids file lock)
          Get-CimInstance Win32_Process -Filter "Name='java.exe'" | Where-Object { $_.CommandLine -like '*giftgpt-server-1.0.0-SNAPSHOT.jar*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

          Copy-Item backend/giftgpt-server/target/giftgpt-server-1.0.0-SNAPSHOT.jar (Join-Path $target 'giftgpt-server-1.0.0-SNAPSHOT.jar') -Force

          # JWT secret: GitHub Secret wins; otherwise reuse the persisted server secret file
          $secretFile = Join-Path $configDir 'jwt-secret.txt'
          if ([string]::IsNullOrWhiteSpace($env:JWT_SECRET)) {
            if (Test-Path $secretFile) {
              $jwtSecret = (Get-Content $secretFile -Raw).Trim()
            } else {
              $rng = New-Object System.Security.Cryptography.RNGCryptoServiceProvider
              $bytes = New-Object byte[] 32
              $rng.GetBytes($bytes)
              $jwtSecret = -join ($bytes | ForEach-Object { $_.ToString('x2') })
              Set-Content -Path $secretFile -Value $jwtSecret -Encoding ascii -Force
              Write-Output "WARN: JWT_SECRET not configured, generated and persisted a server secret"
            }
          } else {
            $jwtSecret = $env:JWT_SECRET
            Set-Content -Path $secretFile -Value $jwtSecret -Encoding ascii -Force
          }

          # Keep existing server keys when a GitHub Secret is not configured
          $oldConfig = Join-Path $configDir 'application-prod.yml'
          $old = if (Test-Path $oldConfig) { Get-Content $oldConfig -Raw } else { '' }
          $deepseekKey = if (![string]::IsNullOrWhiteSpace($env:DEEPSEEK_API_KEY)) { $env:DEEPSEEK_API_KEY } elseif ($old -match 'api-key:\s*(\S+)') { $matches[1].Trim() } else { '' }
          $pddClientId = if (![string]::IsNullOrWhiteSpace($env:PDD_CLIENT_ID)) { $env:PDD_CLIENT_ID } elseif ($old -match 'client-id:\s*(\S+)') { $matches[1].Trim() } else { '' }
          $pddClientSecret = if (![string]::IsNullOrWhiteSpace($env:PDD_CLIENT_SECRET)) { $env:PDD_CLIENT_SECRET } elseif ($old -match 'client-secret:\s*(\S+)') { $matches[1].Trim() } else { '' }

          $config = @"
          spring:
            h2:
              console:
                enabled: false
          sa-token:
            jwt-secret-key: $jwtSecret
          giftgpt:
            ai:
              deepseek:
                api-key: $deepseekKey
            commerce:
              pinduoduo:
                client-id: $pddClientId
                client-secret: $pddClientSecret
          "@
          $config | Set-Content -Path $oldConfig -Encoding utf8 -Force

          schtasks.exe /End /TN "GiftGPT-Backend" 2>&1 | Out-Null
          schtasks.exe /Run /TN "GiftGPT-Backend" 2>&1 | Out-Null
          Write-Output "BACKEND DEPLOYED AND TASK STARTED"
          exit 0
      - name: Verify backend
        shell: powershell
        run: |
          Start-Sleep 15
          $r = Invoke-WebRequest -Uri "http://localhost:8080/api/v1/products/platforms/pinduoduo/authority" -UseBasicParsing -TimeoutSec 15 -ErrorAction SilentlyContinue
          if ($r -and $r.StatusCode -eq 200) { Write-Output "BACKEND OK" } else { Write-Output "BACKEND WARN: not responding yet" }
