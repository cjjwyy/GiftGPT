name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "C:\node\node-v20.20.2-win-x64" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: npm install
        shell: powershell
        working-directory: frontend/giftgpt-web
        run: |
          npm install --no-audit --no-fund --registry=https://registry.npmmirror.com
      - name: Lint and typecheck
        shell: powershell
        working-directory: frontend/giftgpt-web
        run: |
          npm run lint
          npm run typecheck
      - name: Build standalone
        shell: powershell
        working-directory: frontend/giftgpt-web
        run: |
          npm run build
      - name: Assemble and deploy
        shell: powershell
        run: |
          Copy-Item -Recurse -Force frontend/giftgpt-web/.next/static frontend/giftgpt-web/.next/standalone/.next/static
          if (Test-Path frontend/giftgpt-web/public) {
            Copy-Item -Recurse -Force frontend/giftgpt-web/public frontend/giftgpt-web/.next/standalone/public
          }
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like '*server.js*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep 2
          Remove-Item C:\giftgpt-web -Recurse -Force -ErrorAction SilentlyContinue
          robocopy frontend/giftgpt-web/.next/standalone C:\giftgpt-web /E /R:1 /W:1 | Out-Null
          schtasks /Create /TN "GiftGPT-Web" /TR "cmd /c cd /d C:\giftgpt-web && C:\node\node-v20.20.2-win-x64\node.exe server.js" /SC ONSTART /RU SYSTEM /F | Out-Null
          Start-Process -FilePath "C:\node\node-v20.20.2-win-x64\node.exe" -ArgumentList "C:\giftgpt-web\server.js" -WorkingDirectory "C:\giftgpt-web" -WindowStyle Hidden
          Start-Sleep 8
          exit 0
      - name: Verify
        shell: powershell
        run: |
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3000/" -UseBasicParsing -TimeoutSec 15
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep 2
          }
          if (-not $ok) { throw "Web server not responding" }
          Write-Output "WEB OK"